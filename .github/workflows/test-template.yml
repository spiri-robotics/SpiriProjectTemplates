name: Template Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv pip install pytest copier jinja2 toml pyyaml

      - name: Run tests
        run: uv run pytest tests/ -v

      - name: Generate a sample project for workflow linting
        run: |
          uv run copier copy --trust --defaults . /tmp/sample-default

      - name: Install actionlint
        run: curl -sL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash

      - name: Lint generated GitHub Actions workflows
        run: ./actionlint /tmp/sample-default/.github/workflows/*.yml
